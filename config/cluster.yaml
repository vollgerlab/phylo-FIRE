# CHPC Redwood paths for the 180K HSCA run, layered over config/config.yaml.
# Stage 1: pixi run -- snakemake --configfile config/cluster.yaml \
#            --rerun-triggers mtime --profile profiles/slurm -j <N>
# Stage 2: pixi run hsca-stage2. pixi tasks (e.g. hsca-hapsel) override run_name/peak_ids.
input_table: "/scratch/ucgd/lustre-labs/vollger/projects/HPRCv2/fiber-seq-pilot/union-peaks-asm.bed.gz"
agc: "/scratch/ucgd/lustre-labs/vollger/projects/HPRCv2/impg/HPRC_r2_assemblies_0.6.1.agc"

# The 180,684 HSCA peaks; without this, peak_ids=null targets every peak in the
# union BED. Regenerate: pixi run hsca-peak-ids (needs pixi run setup-hsca).
peak_ids: "config/hsca_peak_ids.txt"
run_name: "hsca"

# Stage 2 (plasmid_all) builds the plasmid construct panel from the Stage-1 tables.
plasmid: true
