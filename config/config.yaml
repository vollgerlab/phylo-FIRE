# Bgzipped union-peaks BED (columns resolved by header name; extract_fastas sorts
# by peak). config/cluster.yaml overrides this and agc for CHPC runs.
input_table: "resources/union-peaks-asm.bed.gz"

# Optional: link {peak_id}.fa/.tsv pairs from a pre-extracted dir (e.g. PARE's
# paralog_msas/) instead of reading input_table.
preextracted_dir: null

# Peak selection: a file of consensus_peak_ids (one per line), and/or a
# haplotype_distinct class filter (requires peak_ids on a fresh run).
peak_ids: null
haplotype_distinct: null

# Only use primary samples
primary_only: true

# Drop peaks with fewer unique RE sequences. 1 keeps monomorphic (epigenetic)
# peaks, which are part of the deliverable, and means extract drops a peak only
# if it has zero non-NA sequences, so declared per-peak outputs never go missing.
min_seqs: 1

# Leaves with fewer fibers are dropped from phylo_mm's attribution WLS (H2_p
# handles low coverage via mev instead). 0 disables the floor.
min_coverage: 4

# bp of AGC context added each side of the RE (0 = RE only, no AGC). Resolves
# the tree and cuts H2_p prior-dependence; ignored for preextracted_dir.
flank: 250
agc: "resources/HPRC_r2_assemblies_0.6.1.agc"

# Stage 2: project variable sites to CHM13 + hg38 and write the VCF/BEDs. Needs
# the AGC (with GRCh38 + CHM13); skipped for preextracted runs or a missing AGC.
project_hg38: true

# H2 gate: attribute drivers only if the alpha.V=1 95% HPD width <= max and its
# lower bound >= min (RE-only tree first, then the whole flanked region).
h2_hpd_width_max: 0.5
h2_hpd_lower_min: 0.1

# Outputs go to results/{run_name}/ and temp/{run_name}/; pixi tasks set their own.
run_name: "default"

# Write interactive HTML plots (~4 MB each) alongside the PDF.
plot_html: false

# Plot selection: every driver and heritable-but-no-driver peak, plus this many
# seeded-random control peaks.
random_n: 100
random_seed: 42

# MAFFT parameters
mafft_maxiterate: 1000

# bgzip threads for decompression
bgzip_threads: 16

# Optional per-leaf PCLAI ancestry stripe in the plot (merged CHM13 + asm-coord
# BED from `pixi run setup-pclai`). null disables it.
pclai_bed: "resources/pclai/hprc_r2.bed.gz"

# Other keys the code reads (code defaults shown; uncomment to set):
# plasmid: false            # Stage 2 plasmid construct panel
# dbsnp: null               # tabix-indexed dbSNP VCF for rs IDs
# significant_loci: null    # plasmid significance table (needs dbsnp)
# stage2_threads: 16
# project_threads: 32
# highlight_file: null      # TSV of sample haps to tag and highlight in plots
