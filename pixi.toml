[workspace]
authors = ["Mitchell R. Vollger <mrvollger@gmail.com>"]
channels = ["conda-forge", "bioconda"]
description = "Phylogenetic tree pipeline for consensus FIRE peaks"
name = "phylo-FIRE"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Snakemake handles its own incremental builds; if you need to force a rebuild
# use `--forcerun <rule>` or `--forceall`, not a manual `rm -rf results`.
test = { cmd = [
    "snakemake",
    "--config", "peak_ids=config/test_peak_ids.txt",
    "--config", "input_table=resources/test/test-union-peaks.bed.gz",
    "-j", "8",
] }
dry-run = { cmd = [
    "snakemake",
    "--config", "peak_ids=config/test_peak_ids.txt",
    "--config", "input_table=resources/test/test-union-peaks.bed.gz",
    "-n", "--quiet",
] }
replot = { cmd = [
    "snakemake",
    "--config", "peak_ids=config/test_peak_ids.txt",
    "--config", "input_table=resources/test/test-union-peaks.bed.gz",
    "--forcerun", "plot",
    "-j", "8",
] }
# Per-paralog-group MSA test using a fixture pre-extracted by PARE's
# `extract_paralog_msas` rule. Exercises the `preextracted_dir` ingestion path.
# pg_9 = chr1 NOTCH2NL paralog group (NOTCH2NLA / B / C / R; 276 sequences,
# 71 unique). Build artifacts: results/{trees,plots}/pg_9.{treefile,html,pdf}.
test-paralog = { cmd = [
    "snakemake",
    "--config", "preextracted_dir=resources/test/preextracted_pg_9",
    "-j", "8",
] }
fmt = "snakefmt workflow/Snakefile"

[dependencies]
python = ">=3.11"
snakemake = ">=8.0"
snakemake-executor-plugin-slurm = "*"
htslib = "*"
mafft = "*"
iqtree = "*"
snakefmt = "*"
biopython = "*"
matplotlib = "*"
plotly = "*"
python-kaleido = "*"
