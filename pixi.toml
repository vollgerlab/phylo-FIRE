[workspace]
authors = ["Mitchell R. Vollger <mrvollger@gmail.com>"]
channels = ["conda-forge", "bioconda"]
description = "Phylogenetic tree pipeline for consensus FIRE peaks"
name = "phylo-FIRE"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
test = { cmd = [
    "snakemake",
    "--notemp",
    "--config",
    "run_name=test",
    "peak_ids=config/test_peak_ids.txt",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "--rerun-triggers",
    "mtime",
    "-j",
    "10",
] }
replot = { cmd = [
    "snakemake",
    "-s",
    "workflow/analysis.smk",
    "--config",
    "run_name=test",
    "peak_ids=config/test_peak_ids.txt",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "--rerun-triggers",
    "mtime",
    "--forcerun",
    "plot_all",
    "-j",
    "10",
] }
# Main local smoke test and the only one that runs both stages. 20 peaks span the
# haplotype_distinct classes, 10 have many unique RE seqs (multi-driver attribution).
# min_seqs=1 keeps monomorphic (epigenetic) peaks.
hap-selective-30 = { cmd = [
    "bash",
    "-c",
    "snakemake --notemp --config run_name=hap-selective-30 peak_ids=config/hap_selective_30_peak_ids.txt input_table=resources/hap-selective-30/hap-selective-30.bed.gz min_seqs=1 --rerun-triggers mtime -j 10 && snakemake -s workflow/analysis.smk --notemp --config run_name=hap-selective-30 peak_ids=config/hap_selective_30_peak_ids.txt input_table=resources/hap-selective-30/hap-selective-30.bed.gz min_seqs=1 plasmid=true --rerun-triggers mtime -j 10",
] }
# 12 Genetically-haplotype-specific peaks: 6 low-spread (drivers attributed) and
# 6 high-spread (RE-H2 gate fails, mode none). Stage 1 only, like the tasks below.
genetic-candidates = { cmd = [
    "snakemake",
    "--notemp",
    "--config",
    "run_name=genetic-candidates",
    "peak_ids=config/genetic_candidates_peak_ids.txt",
    "input_table=resources/genetic-candidates/genetic-candidates.bed.gz",
    "min_seqs=1",
    "--rerun-triggers",
    "mtime",
    "-j",
    "10",
] }
# 5 haplotype-selective peaks, tabix-pulled from the chm13-coord union BED.
hap-selective-5 = { cmd = [
    "snakemake",
    "--notemp",
    "--config",
    "run_name=hap-selective-5",
    "peak_ids=config/hap_selective_5_peak_ids.txt",
    "input_table=resources/hap-selective-5/hap-selective-5.bed.gz",
    "--rerun-triggers",
    "mtime",
    "-j",
    "10",
] }
# Same 5 peaks, only individuals classed exactly Haplotype-selective (~10 leaves).
hap-selective-5-samples = { cmd = [
    "snakemake",
    "--notemp",
    "--config",
    "run_name=hap-selective-5-samples",
    "peak_ids=config/hap_selective_5_peak_ids.txt",
    "input_table=resources/hap-selective-5/hap-selective-5-samples.bed.gz",
    "highlight_file=config/hap_selective_5_highlights.tsv",
    "min_seqs=2",
    "--rerun-triggers",
    "mtime",
    "-j",
    "10",
] }
# Synthetic nested driver (no real peak has one): an opposite-sign variant in a
# subset of a real driver's carriers. Built by scripts/tools/make_nested_fixture.py.
test-nested = { cmd = [
    "snakemake",
    "--notemp",
    "--config",
    "run_name=nested",
    "preextracted_dir=resources/test/preextracted_nested",
    "flank=0",
    "min_seqs=2",
    "--rerun-triggers",
    "mtime",
    "-j",
    "10",
] }
# PARE preextracted_dir fixture pg_31: the NOTCH2/NOTCH2NLA-C promoters plus NBPF26,
# 6 haps -> 24 seqs. PARE group ids change between runs (pg_9 -> pg_64 -> pg_31).
test-paralog = { cmd = [
    "snakemake",
    "--notemp",
    "--config",
    "run_name=test-paralog",
    "preextracted_dir=resources/test/preextracted_pg_31",
    "flank=0",
    "--rerun-triggers",
    "mtime",
    "-j",
    "10",
] }
# Same 5 paralog peaks with all 78 primary haps (319 seqs).
test-paralog-all-haps = { cmd = [
    "snakemake",
    "--notemp",
    "--config",
    "run_name=test-paralog-all-haps",
    "preextracted_dir=resources/test/preextracted_pg_31_all_haps",
    "flank=0",
    "--rerun-triggers",
    "mtime",
    "-j",
    "10",
] }
fmt = "snakefmt workflow/"
# Unit tests for the Python scripts (AGC-backed tests skip without the archive).
unit = "pytest workflow/scripts/tests -q"
# One-time: HPRC R2 PCLAI BEDs -> resources/pclai/hprc_r2.bed.gz (+ .tbi).
setup-pclai = "bash workflow/scripts/build_pclai_bed.sh"
# One-time: carve every HSCA peak out of the union BED into resources/hsca/.
setup-hsca = "bash workflow/scripts/build_hsca_table.sh"
# config/hsca_peak_ids.txt (~180.7K ids, used by config/cluster.yaml). Needs setup-hsca.
hsca-peak-ids = "bash -c 'tail -n +2 resources/hsca/hsca-index.tsv | cut -f6 > config/hsca_peak_ids.txt && echo wrote $(wc -l < config/hsca_peak_ids.txt) peak ids'"
# One HSCA class (Haplotype-selective, ~23K peaks), run locally on the fat node.
# Rules cap OMP/OPENBLAS/POLARS threads to their declared threads, so a high -j
# does not oversubscribe cores. Append `--profile profiles/slurm` to submit instead.
hsca-hapsel-ids = "bash workflow/scripts/hsca_class_ids.sh 'Haplotype-selective' config/hsca_hapsel_peak_ids.txt"
hsca-hapsel = { cmd = [
    "snakemake",
    "--configfile",
    "config/cluster.yaml",
    "--config",
    "run_name=hsca_hapsel",
    "peak_ids=config/hsca_hapsel_peak_ids.txt",
    # mtime only: a resume or code edit must not recompute trees already on disk.
    "--rerun-triggers",
    "mtime",
    "-j",
    "250",
] }
# Rebuild tables/{alignments,trees,phylo_mm}.parquet outside the DAG (~3 min).
hsca-hapsel-tables = { cmd = [
    "python",
    "workflow/scripts/stage1_tables.py",
    "--results",
    "results/hsca_hapsel",
    "--peaks",
    "results/hsca_hapsel/fastas/peak_ids.txt",
    "--threads",
    "32",
] }
# Stage 2 (workflow/analysis.smk) reads only results/<run>/tables/, so it never
# recomputes a tree. Use the Stage-1 run_name; add dbsnp=<vcf.gz> for rs IDs.
hsca-hapsel-stage2 = { cmd = [
    "snakemake",
    "-s",
    "workflow/analysis.smk",
    "--configfile",
    "config/cluster.yaml",
    "--config",
    "run_name=hsca_hapsel",
    "peak_ids=config/hsca_hapsel_peak_ids.txt",
    "plasmid=true",
    "stage2_threads=256",
    "--rerun-triggers",
    "mtime",
    "-j",
    "256",
] }
hsca-stage2 = { cmd = [
    "snakemake",
    "-s",
    "workflow/analysis.smk",
    "--configfile",
    "config/cluster.yaml",
    "--config",
    "plasmid=true",
    "--rerun-triggers",
    "mtime",
    "-j",
    "400",
] }

# Pinned to major.minor; pixi.lock holds the exact builds.
[dependencies]
python = ">=3.13,<3.14"
snakemake = ">=9.27,<9.28"
snakemake-executor-plugin-slurm = ">=2.6,<2.7"
htslib = ">=1.23,<1.24"
mafft = ">=7.526,<7.527"
iqtree = ">=3.1,<3.2"
snakefmt = ">=1.0,<1.1"
biopython = ">=1.87,<1.88"
polars = ">=1.42,<1.43"
matplotlib = ">=3.10,<3.11"
plotly = ">=6.6,<6.7"
# python-kaleido is per platform: 0.2.x on linux, because v1's Chromium cannot
# render on the cluster (plotly/Kaleido#421), and v1 on macOS (no 0.2.x arm build).
pysam = ">=0.24,<0.25"
r-base = ">=4.5,<4.6"
r-ape = ">=5.8,<5.9"
r-mcmcglmm = ">=2.36,<2.37"
agc = ">=3.2.3,<3.3"
pytest = ">=9.0,<9.1"

# Shared libs headless Chromium needs for PDF export (libnss3, libgbm, ...). The
# cluster OS lacks them and conda-forge supplies them without sudo.
[target.linux-64.dependencies]
python-kaleido = ">=0.2,<0.3"
nss = "*"
nspr = "*"
at-spi2-atk = "*"
at-spi2-core = "*"
"atk-1.0" = "*"
libcups = "*"
libgbm = "*"
libxkbcommon = "*"
alsa-lib = "*"
dbus = "*"
expat = "*"
pango = "*"
cairo = "*"
libxcb = "*"
xorg-libx11 = "*"
xorg-libxext = "*"
xorg-libxcomposite = "*"
xorg-libxdamage = "*"
xorg-libxfixes = "*"
xorg-libxrandr = "*"
xorg-libxtst = "*"
xorg-libxrender = "*"
xorg-libxi = "*"
xorg-libxscrnsaver = "*"

[target.osx-arm64.dependencies]
python-kaleido = ">=1.2,<1.3"
