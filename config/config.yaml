# Input table (bgzipped BED from union-peaks.Rmd pipeline)
input_table: "Tables/union-peaks-cons.bed.gz"

# Optional: bypass the bgzip|extract_fastas step entirely and pull
# {peak_id}.fa / {peak_id}.tsv pairs from a pre-extracted directory
# (e.g. PARE's `paralog_msas/` output). When set, `input_table` is ignored.
preextracted_dir: null

# Filter criteria for which peaks to process
# Set peak_ids to a file of consensus_peak_ids (one per line) to process specific peaks
# Or set haplotype_distinct to filter by class (e.g., "Haplotype-selective")
peak_ids: null
haplotype_distinct: null

# Only use primary samples
primary_only: true

# Minimum number of unique sequences to build a tree
min_seqs: 2

# MAFFT parameters
mafft_maxiterate: 1000

# bgzip threads for decompression
bgzip_threads: 16

# Optional: per-leaf PCLAI ancestry stripe in the plot. Path to the merged
# bgzipped + tabix-indexed HPRC R2 PCLAI BED (chm13 + asm coord spaces in
# one file) produced by `pixi run setup-pclai`. Set to null to disable.
pclai_bed: "resources/pclai/hprc_r2.bed.gz"
