# Input table: bgzipped union-peaks BED. Columns are resolved by header name,
# and the extract_fastas checkpoint sorts by consensus_peak_id, so the
# asm-coord-sorted production BED works directly. This default points at the
# local copy; `config/cluster.yaml` overrides it (+ agc) for CHPC runs.
input_table: "resources/union-peaks-asm.bed.gz"

# Optional: bypass the bgzip|extract_fastas step entirely and pull
# {peak_id}.fa / {peak_id}.tsv pairs from a pre-extracted directory
# (e.g. PARE's `paralog_msas/` output). When set, `input_table` is ignored.
preextracted_dir: null

# Filter criteria for which peaks to process
# Set peak_ids to a file of consensus_peak_ids (one per line) to process specific peaks
# Or set haplotype_distinct to filter by class (e.g., "Haplotype-selective")
peak_ids: null
haplotype_distinct: null

# Only use primary samples
primary_only: true

# Minimum number of unique sequences to build a tree
min_seqs: 2

# Minimum per-leaf coverage (fibers) for a leaf to enter the per-branch
# clade-vs-rest actuation test in phylo_mm.R. Leaves are also coverage-weighted
# (WLS) within the test. Does NOT affect the H2_p model (it downweights low
# coverage via mev instead). Set to 0 to disable the floor.
min_coverage: 4

# Flanking sequence (bp) added each side of the peak, pulled from the AGC
# archive below. 0 = use the BED `seq` column directly (no AGC, RE only).
# Default 250 (~500 bp of context around the RE) gives the per-peak tree enough
# variable sites to resolve and cuts H2_p prior-dependence, while keeping the RE
# the bulk of the alignment; the RE sub-span is bracketed in the plot. Only
# applies to the union-BED extraction path (preextracted_dir / PARE controls
# its own flanks).
flank: 250
agc: "resources/HPRC_r2_assemblies_0.6.1.agc"

# Heritability gate for variant attribution. phylo_mm fits H2_p on the RE-only
# tree first; variants are attributed only when actuation is a stable + heritable
# function of sequence. "Stable" = the 95% HPD is no wider than h2_hpd_width_max
# (matches the plot's ⚠ unidentified flag). "Significant" = the HPD lower bound
# is at least h2_hpd_lower_min (confidently heritable, not ~0). If the RE-only H2
# fails, attribution expands to the whole (flanked) region and uses that H2
# instead; if both fail, no drivers are reported.
h2_hpd_width_max: 0.5
h2_hpd_lower_min: 0.1

# Run name: all outputs are namespaced under results/{run_name}/ and
# temp/{run_name}/ so separate runs never clobber or orphan each other (and can
# run concurrently). Each pixi task sets this to its own name; override per run
# with --config run_name=<name>.
run_name: "default"

# Plot selection (data-driven, post-aggregate). Every peak with >=1 driver and
# every heritable-but-no-driver peak is plotted (unlimited); plus this many
# seeded-random peaks as controls.
# Write interactive HTML plots (~4 MB each) alongside the PDF. Off by default;
# enable with --config plot_html=true.
plot_html: false

random_n: 100
random_seed: 42

# MAFFT parameters
mafft_maxiterate: 1000

# bgzip threads for decompression
bgzip_threads: 16

# Optional: per-leaf PCLAI ancestry stripe in the plot. Path to the merged
# bgzipped + tabix-indexed HPRC R2 PCLAI BED (chm13 + asm coord spaces in
# one file) produced by `pixi run setup-pclai`. Set to null to disable.
pclai_bed: "resources/pclai/hprc_r2.bed.gz"
