[workspace]
authors = ["Mitchell R. Vollger <mrvollger@gmail.com>"]
channels = ["conda-forge", "bioconda"]
description = "Phylogenetic tree pipeline for consensus FIRE peaks"
name = "phylo-FIRE"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Snakemake handles its own incremental builds; if you need to force a rebuild
# use `--forcerun <rule>` or `--forceall`, not a manual `rm -rf results`.
test = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/test_peak_ids.txt",
    "--config",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "-j",
    "8",
] }
dry-run = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/test_peak_ids.txt",
    "--config",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "-n",
    "--quiet",
] }
replot = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/test_peak_ids.txt",
    "--config",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "--forcerun",
    "plot",
    "-j",
    "8",
] }
# 20 HSCA peaks spanning the haplotype_distinct categories, pulled from the
# full union-peaks-asm.bed.gz: 10 epigenetically-haplotype-selective, 6 genetic
# Haplotype-selective, 2 mixed (epi+genetic), 2 Genetically-haplotype-specific,
# across 14 chromosomes (~78 leaves/peak; the two chr9 Gspecific peaks ~41-45).
# This is the primary hap-selective test case.
hap-selective-20 = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/hap_selective_20_peak_ids.txt",
    "input_table=resources/hap-selective-20/hap-selective-20.bed.gz",
    # min_seqs=1: pure-epigenetic peaks are monomorphic at the RE (the
    # haplotype-selectivity is epigenetic, not sequence) so they have 1 unique
    # RE sequence; the +500 bp flanks still resolve the tree (~10 unique), and
    # they carry 0 RE-anchored branches — the epigenetic signature.
    "min_seqs=1",
    "-j",
    "8",
] }
# hap-selective-20 + 10 Genetically-haplotype-specific peaks chosen for HIGH
# haplotype-sequence diversity (47, 22, 20, 19, 17, 11, 9, 8, 5, 3 unique RE
# seqs) across 9 chromosomes — i.e. likely MULTI-variant drivers, to exercise
# the forward-selection variant attribution. Pulled from the HSCA reference
# table (`pixi run setup-hsca`); see config/hap_selective_30_peak_ids.txt.
hap-selective-30 = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/hap_selective_30_peak_ids.txt",
    "input_table=resources/hap-selective-30/hap-selective-30.bed.gz",
    "min_seqs=1",
    "-j",
    "8",
] }
# 5 haplotype-selective peaks pulled from hyak's union-peaks-chm13.bed.gz via
# tabix region query (see resources/hap-selective-5/README.md). 5 peaks x ~90
# sample-haps = 450 rows. Source TSV:
#   /mmfs1/gscratch/stergachislab/HPRC/mrv-figures/Tables/example-hap-selective-peaks-sample.tsv
hap-selective-5 = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/hap_selective_5_peak_ids.txt",
    "input_table=resources/hap-selective-5/hap-selective-5.bed.gz",
    "-j",
    "8",
] }
# Same 5 peaks, restricted per-peak to rows whose haplotype_distinct
# classification is exactly "Haplotype-selective". Each peak's set of
# qualifying individuals contributes both haps → 10 leaves per peak
# (chr21 has 12 because 6 individuals are hap-selective at that locus).
hap-selective-5-samples = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/hap_selective_5_peak_ids.txt",
    "input_table=resources/hap-selective-5/hap-selective-5-samples.bed.gz",
    "highlight_file=config/hap_selective_5_highlights.tsv",
    "min_seqs=2",
    "-j",
    "8",
] }
# Per-paralog-group MSA test using a fixture pre-extracted by PARE's
# `extract_paralog_msas` rule. Exercises the `preextracted_dir` ingestion path.
# pg_31 = canonical chr1 NOTCH2NL promoter family: NOTCH2 (1p11) +
# NOTCH2NLA / NOTCH2NLB / NOTCH2NLC promoters (1q21) + NBPF26. 5 consensus
# peaks (the 4 NOTCH2/NL promoters plus NBPF26, which the current PARE run
# detects as a paralog edge); small fixture has 6 haps from 3 individuals
# (HG01123, HG01891, HG02486) -> 24 sequences (NBPF26 coverage is sparse).
# Build artifacts: results/{trees,plots}/pg_31.{treefile,html,pdf}.
# Renamed from pg_64 in 2026-05; group ID shifted because the chr1 SD belt
# rerun added NBPF26 as a 5th member, and union-find IDs aren't stable
# across PARE runs.
test-paralog = { cmd = [
    "snakemake",
    "--config",
    "preextracted_dir=resources/test/preextracted_pg_31",
    "flank=0",
    "-j",
    "8",
] }
# All-haps version of the pg_31 fixture: same 5 paralog peaks but pulled
# from the full HPRCv2 union BED (45 individuals -> 78 primary haps after
# filtering to is_primary_sample). 319 sequences vs 24 in the small fixture.
test-paralog-all-haps = { cmd = [
    "snakemake",
    "--config",
    "preextracted_dir=resources/test/preextracted_pg_31_all_haps",
    "flank=0",
    "-j",
    "8",
] }
fmt = "snakefmt workflow/Snakefile"
# One-time bulk fetch of HPRC R2 PCLAI BEDs (CHM13 + asm coord spaces)
# merged into resources/pclai/hprc_r2.bed.gz, bgzipped + tabixed.
setup-pclai = "bash workflow/scripts/build_pclai_bed.sh"
# One-time: carve all HSCA peaks (any haplotype-selective class) out of the full
# union BED into resources/hsca/ (hsca-peaks.bed.gz + hsca-index.tsv), a
# reference table for minting new test cases quickly. Not run wholesale.
setup-hsca = "bash workflow/scripts/build_hsca_table.sh"
# Install selectiveInference + its CRAN deps into the pixi-managed R library.
# selectiveInference isn't on conda-forge; r-remotes is. Run once after `pixi install`.
setup-selectiveinference = """Rscript -e 'if (!requireNamespace("selectiveInference", quietly=TRUE)) install.packages("selectiveInference", repos="https://cloud.r-project.org") else cat("selectiveInference already installed\\n")'"""

[dependencies]
python = ">=3.11"
snakemake = ">=8.0"
snakemake-executor-plugin-slurm = "*"
htslib = "*"
mafft = "*"
iqtree = "*"
snakefmt = "*"
biopython = "*"
matplotlib = "*"
plotly = "*"
python-kaleido = "*"
pysam = "*"
# R + phylogenetic mixed model (MCMCglmm) + LASSO (glmnet) + valid
# post-LASSO inference (selectiveInference, Lee/Sun/Sun/Taylor 2016 exact
# post-selection p-values — avoids the double-dipping issue Witten et al.
# discuss). selectiveInference isn't on conda-forge as of 2026-05 — install
# via `pixi run setup-selectiveinference` after `pixi install`.
r-base = ">=4.3"
r-ape = "*"
r-mcmcglmm = "*"
r-glmnet = "*"
r-remotes = "*"
agc = ">=3.2.3,<4"
