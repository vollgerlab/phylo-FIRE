[workspace]
authors = ["Mitchell R. Vollger <mrvollger@gmail.com>"]
channels = ["conda-forge", "bioconda"]
description = "Phylogenetic tree pipeline for consensus FIRE peaks"
name = "phylo-FIRE"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Snakemake handles its own incremental builds; if you need to force a rebuild
# use `--forcerun <rule>` or `--forceall`, not a manual `rm -rf results`.
test = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/test_peak_ids.txt",
    "--config",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "-j",
    "8",
] }
dry-run = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/test_peak_ids.txt",
    "--config",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "-n",
    "--quiet",
] }
replot = { cmd = [
    "snakemake",
    "--config",
    "peak_ids=config/test_peak_ids.txt",
    "--config",
    "input_table=resources/test/test-union-peaks.bed.gz",
    "--forcerun",
    "plot",
    "-j",
    "8",
] }
# Per-paralog-group MSA test using a fixture pre-extracted by PARE's
# `extract_paralog_msas` rule. Exercises the `preextracted_dir` ingestion path.
# pg_31 = canonical chr1 NOTCH2NL promoter family: NOTCH2 (1p11) +
# NOTCH2NLA / NOTCH2NLB / NOTCH2NLC promoters (1q21) + NBPF26. 5 consensus
# peaks (the 4 NOTCH2/NL promoters plus NBPF26, which the current PARE run
# detects as a paralog edge); small fixture has 6 haps from 3 individuals
# (HG01123, HG01891, HG02486) -> 24 sequences (NBPF26 coverage is sparse).
# Build artifacts: results/{trees,plots}/pg_31.{treefile,html,pdf}.
# Renamed from pg_64 in 2026-05; group ID shifted because the chr1 SD belt
# rerun added NBPF26 as a 5th member, and union-find IDs aren't stable
# across PARE runs.
test-paralog = { cmd = [
    "snakemake",
    "--config", "preextracted_dir=resources/test/preextracted_pg_31",
    "-j", "8",
] }
# All-haps version of the pg_31 fixture: same 5 paralog peaks but pulled
# from the full HPRCv2 union BED (45 individuals -> 78 primary haps after
# filtering to is_primary_sample). 319 sequences vs 24 in the small fixture.
test-paralog-all-haps = { cmd = [
    "snakemake",
    "--config", "preextracted_dir=resources/test/preextracted_pg_31_all_haps",
    "-j", "8",
] }
fmt = "snakefmt workflow/Snakefile"
# One-time bulk fetch of HPRC R2 PCLAI BEDs (CHM13 + asm coord spaces)
# merged into resources/pclai/hprc_r2.bed.gz, bgzipped + tabixed.
setup-pclai = "bash workflow/scripts/build_pclai_bed.sh"

[dependencies]
python = ">=3.11"
snakemake = ">=8.0"
snakemake-executor-plugin-slurm = "*"
htslib = "*"
mafft = "*"
iqtree = "*"
snakefmt = "*"
biopython = "*"
matplotlib = "*"
plotly = "*"
python-kaleido = "*"
pysam = "*"
